[tasks.setup]
description = "Submodules and the SSC umbrella headers"
run = """
git submodule update --init --recursive
cd external/ssc/ssc && sh generate_module_header.sh
"""

# build.zig locates a closure through -Ddeps/$XDYN_DEPS, defaulting to libcxx-<flavor>/; the same
# variable overrides where these tasks write one. Every non-host flavor needs x86_64-linux-gnu
# first — they borrow its protoc — and is deliberately not declared as depending on it, since
# that would rebuild it on every invocation.
#
# One task per target triple, and the triple is the whole name: it is what -Dtarget takes, what
# build.zig derives libcxx-<triple> from, and what tools/deps/common.sh cases on.

[tasks."deps:x86_64-linux-gnu"]
description = "Build the x86_64-linux-gnu closure (glibc 2.28 floor) into libcxx-x86_64-linux-gnu/ (hours)"
run = "tools/deps/build-all.sh x86_64-linux-gnu"

[tasks."deps:aarch64-linux-musl"]
description = "Build the aarch64-linux-musl closure (needs deps:x86_64-linux-gnu)"
run = "tools/deps/build-all.sh aarch64-linux-musl"

[tasks."deps:x86_64-windows-gnu"]
description = "Build the x86_64-windows-gnu closure (needs deps:x86_64-linux-gnu)"
run = "tools/deps/build-all.sh x86_64-windows-gnu"

[tasks."deps:fetch"]
description = "Download a prebuilt closure: mise run deps:fetch x86_64-linux-gnu"
# The bootstrap answer for a fresh clone and for CI: ~30 MB per flavor against hours of
# build. Hash-verified against tools/deps/assets.sha256, which also names the release tag.
run = "sh tools/deps/fetch.sh"

[tasks."deps:pack"]
description = "Pack a built closure into a release asset: mise run deps:pack x86_64-linux-gnu"
run = "sh tools/deps/pack.sh"

# -fqemu/-fwine rather than the host's binfmt_misc: where a foreign binary is registered, zig runs
# it transparently and this lane passes without either emulator being declared anywhere. That is a
# property of the developer's machine, not of the repository.
[tasks."cross:aarch64-linux-musl"]
description = "Run the unit suite for aarch64-linux-musl under qemu"
run = "zig build test -Dtarget=aarch64-linux-musl -fqemu"

[tasks."cross:x86_64-windows-gnu"]
description = "Run the unit suite for x86_64-windows-gnu under wine"
run = "zig build test -Dtarget=x86_64-windows-gnu -fwine"

[tasks.cross]
description = "Run both cross suites (needs `nix develop .#cross`)"
# Sequential and explicit rather than `depends`, which mise is free to run in parallel:
# two full builds at once interleave their output and double the peak disk. CI runs the
# two granular tasks as separate jobs instead, so each only needs one target's closure.
run = """
mise run cross:aarch64-linux-musl
mise run cross:x86_64-windows-gnu
"""

[tasks.gdb]
description = "gdb a debug-built exe: mise run gdb -- run_all_tests --gtest_filter=Foo*"
run = "sh tools/gdb.sh"

[tasks."zig:build"]
description = "Build xdyn and the test runner -> build/<target>/bin"
# `zig build test` compiles and runs the suite but installs nothing, so it does NOT leave
# executables behind. Both integration lanes run the real binaries and depend on this.
run = "zig build"

[tasks.integration]
description = "Run the 10 CLI integration tests against the zig build (no docker)"
depends = ["zig:build"]
# `uv sync`, not `uv pip install`: interpreter and packages both come from pyproject.toml +
# the committed uv.lock, so this venv is reproducible rather than "whatever PyPI had today".
# Under build/, beside the wrapper's. See pyproject.toml for what each group holds.
run = """
UV_PROJECT_ENVIRONMENT=build/venv uv sync --only-group test-cli --quiet
make -C integration_tests/xdyn PYTHON="$PWD/build/venv/bin/python" all
"""

[tasks."integration:setup"]
description = "Python env + protobuf stubs for the gRPC/JSON tests"
# --python 3.10 is Hazard N and nothing else: xdyngrpc does not import on 3.11+. It is spelled
# out here rather than in requires-python because only this group is affected — narrowing the
# project would also cap the wrapper's 3.10/3.13/3.15 matrix. See pyproject.toml.
#
# xdyngrpc/_proto is generated, not checked in. The submodule's own Makefile generates it by
# building two docker images; grpc_tools is an ordinary pip package, so we don't.
run = '''
UV_PROJECT_ENVIRONMENT=build/venv-grpc uv sync --only-group test-grpc --python 3.10 --quiet
mkdir -p interfaces/xdyngrpc/_proto
touch interfaces/xdyngrpc/_proto/__init__.py
build/venv-grpc/bin/python -m grpc_tools.protoc \
    -I interfaces/proto \
    --python_out=interfaces/xdyngrpc/_proto \
    --grpc_python_out=interfaces/xdyngrpc/_proto \
    interfaces/proto/*.proto
# Generated stubs import each other as top-level modules; make them package-relative.
# Portability: no `sed -i` (BSD reads the next arg as a backup suffix) and `&` rather than
# the GNU-only `\0` for "the whole match".
for f in interfaces/xdyngrpc/_proto/*.py; do
    sed -E 's/^import.*_pb2/from . &/' "$f" > "$f.rel" && mv "$f.rel" "$f"
done
'''

[tasks."integration:grpc"]
description = "Run the 8 gRPC + 1 JSON protocol integration tests (no docker)"
depends = ["zig:build", "integration:setup"]
run = """
make -C integration_tests/grpc_tests
make -C integration_tests/json_tests
"""

[tasks."deploy:stage"]
description = "Build for the deploy glibc floor and stage stripped binaries into build/deploy/"
# DEPLOY_GLIBC is not tuning, it is the difference between an image that runs and one that
# does not. A default `zig build` targets the *host's* glibc: on this box that emits
# remainder@GLIBC_2.43, and the image then dies at startup with "version `GLIBC_2.43' not
# found" on anything shipping less -- including Debian trixie, which is as new as base images
# get. Pinning the version in the target triple is the same mechanism manylinux wheels use.
#
# 2.28 is the FLOOR, and it is set by the closure rather than by xdyn: tools/deps/common.sh
# builds every dependency at that floor, so raising it here buys nothing and lowering it
# means rebuilding the closure. Keep the two numbers equal.
#
# The explicit -Dtarget is doing two jobs, and the second one is why the image works at all.
# It pins the glibc floor, obviously. It also makes zig emit the *standard* interpreter path:
# a target-less build inside `nix develop` bakes /nix/store/...-glibc-2.42/lib/ld-linux-x86-64.so.2
# as PT_INTERP, which runs on that machine and nowhere else -- there is no /nix/store in a
# container. Naming a target switches zig to /lib64/ld-linux-x86-64.so.2. Never stage a
# target-less build.
#
# --prefix on purpose: build.zig names its install trees <arch>-<os>-<abi>, which does NOT
# include the glibc version, so this build and the native one would otherwise both land in
# build/x86_64-linux-gnu/ and silently overwrite each other.
#
# llvm-strip and llvm-nm, never the binutils ones, and no fallback -- Hazard R. A strip built
# for one architecture no-ops on anything else and still exits 0, so a fallback does not
# degrade gracefully, it ships an unstripped image while reporting success. The devShell
# deliberately carries no binutils at all, so a bare `nm` here would be the host's.
#
# Six binaries, not all thirteen. run_all_tests, test_hs, yml2test and friends are development
# tools; shipping them would triple the image to no one's benefit. The two generators earn
# their place because they are how a user gets the tutorials that used to live in /usr/demos.
run = '''
set -e
DEPLOY_GLIBC=${DEPLOY_GLIBC:-2.28}
for t in llvm-strip llvm-nm; do
    command -v $t > /dev/null 2>&1 || { echo "deploy:stage needs $t (pkgs.llvm)" >&2; exit 1; }
done
zig build -Dtarget=x86_64-linux-gnu.$DEPLOY_GLIBC --prefix build/deploy-build
rm -rf build/deploy
mkdir -p build/deploy
for b in xdyn xdyn-for-cs xdyn-for-me gz generate_yaml_example generate_stl_examples; do
    cp "build/deploy-build/bin/$b" build/deploy/
    llvm-strip --strip-debug "build/deploy/$b"
done
# The assertion this task exists to make. Anything above $DEPLOY_GLIBC is an image that builds
# and then dies at startup on the target, which is the expensive way to find out. `sort -V`,
# because 2.28 sorts below 2.2.5 in every other collation.
#
# The floor is folded into the list before sorting, so requiring *less* than it is fine and
# only exceeding it fails. Checking `= floor` instead would reject a binary that got more
# portable.
REQUIRED=$(llvm-nm -D --undefined-only build/deploy/xdyn | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//')
MAX=$(printf '%s\n%s\n' "$REQUIRED" "$DEPLOY_GLIBC" | sort -V | tail -1)
echo "max glibc required: $(printf '%s\n' "$REQUIRED" | sort -V | tail -1) (floor: $DEPLOY_GLIBC)"
[ "$MAX" = "$DEPLOY_GLIBC" ] || {
    echo "refusing to stage: needs GLIBC_$MAX, above the pinned floor $DEPLOY_GLIBC" >&2
    echo "the closure and DEPLOY_GLIBC have drifted apart -- see tools/deps/common.sh" >&2
    exit 1
}
du -sh build/deploy
'''

[tasks."deploy:image"]
description = "Build the xdyn deploy image from the Containerfile"
depends = ["deploy:stage"]
# Both runtimes are driven identically below; podman is preferred only because it reads
# ./Containerfile without -f. -f is passed explicitly so either one works the same way.
#
# `podman images` will report this image as created ~46 years ago. That is not a clock bug:
# nix develop exports SOURCE_DATE_EPOCH=315532800 (1980-01-01) and buildah honours it, which
# is reproducibility working rather than failing. Unset it if a real timestamp is wanted.
#
# The build context is the repository root, so .dockerignore is load-bearing rather than
# tidy: only build/deploy/ is COPYed, and without it both runtimes tar .zig-cache first --
# tens of GB before the first instruction runs.
run = '''
CONTAINER=${CONTAINER:-$(command -v podman > /dev/null 2>&1 && echo podman || echo docker)}
"$CONTAINER" build -f Containerfile -t localhost/xdyn-deploy .
# `images`, not `image inspect --format`: mise renders task scripts through Tera, so a
# Go-template size expression is parsed as a mise expression and the task never reaches the
# shell. That applies to comments too -- Tera does not know what a shell comment is.
"$CONTAINER" images localhost/xdyn-deploy
'''

[tasks."deploy:server-image"]
description = "Build the xdyngrpc-python server image used by the deployment smoke test"
# The real deployment image for the Python-side gRPC servers, straight out of the interfaces
# submodule and unmodified. The smoke test's whole point is to exercise the artifact people
# actually deploy, so this must not become a locally-tweaked variant of it.
run = '''
CONTAINER=${CONTAINER:-$(command -v podman > /dev/null 2>&1 && echo podman || echo docker)}
"$CONTAINER" build -f interfaces/Dockerfile.python -t localhost/xdyngrpc-python interfaces
'''

[tasks."deploy:test"]
description = "Deployment smoke test: the image starts, simulates, and serves gRPC"
# zig:build as well as the two images: step 3 runs a *native* xdyn-for-me against the
# containerised server, so it needs the ordinary build tree too.
depends = ["zig:build", "deploy:image", "deploy:server-image", "integration:setup"]
run = "sh integration_tests/deploy/run.sh"

[tasks."python:setup"]
description = "Python env for the pybind11 wrapper (pinned pybind11 + numpy)"
run = 'UV_PROJECT_ENVIRONMENT=build/venv-wrapper uv sync --only-group wrapper --quiet'

[tasks."python:build"]
description = "Build the pybind11 extension module -> build/<triple>/python/"
depends = ["python:setup"]
# The import is the check: the module links no libpython, so a missing xdyn symbol links
# quietly and only surfaces here. It also exercises module init and its ~700 registrations.
run = '''
PY=$PWD/build/venv-wrapper/bin/python
zig build python -Dpython="$PY" \
    -Dgit-version="$(git describe --abbrev=0 --tag --always | cut -f2 -dv)"
SO_DIR=$(sh tools/build-dir.sh)/python
SO=$SO_DIR/xdyn$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
[ -f "$SO" ] || { echo "expected $SO, got:"; ls "$SO_DIR"; exit 1; }
PYTHONPATH="$SO_DIR" "$PY" -c "import xdyn; print('import ok, xdyn', xdyn.__version__)"
echo "OK -> $SO"
'''

[tasks."python:test"]
description = "Run the 285 Python binding tests against the built module"
depends = ["python:build"]
# Out of tree: several tests write YAML and CSV next to the cwd. The suite is named explicitly
# because pytest resolves pyproject's testpaths against the invocation directory, not rootdir.
run = '''
SO_DIR=$(sh tools/build-dir.sh)/python
mkdir -p build/python-tests
cd build/python-tests
PYTHONPATH="$SO_DIR" ../venv-wrapper/bin/python -m pytest ../../xdyn_wrapper_python/unit_tests
'''

[tasks."python:matrix"]
description = "Build and test the wrapper against each supported Python (3.10, 3.13, 3.15)"
# What the retired Dockerfile_deb11_py3yz_{pybind,test} pair covered as Python x distro. The
# distro axis is gone: zig targets a glibc floor and links libc++ statically, so only the
# interpreter varies. numpy<2 has no wheel past 3.12, so the first sync per version builds it.
run = '''
set -e
for V in ${XDYN_PYTHON_VERSIONS:-3.10 3.13 3.15}; do
    echo "--- Python $V"
    UV_PROJECT_ENVIRONMENT=build/venv-wrapper-$V uv sync --only-group wrapper --python "$V" --quiet
    PY=$PWD/build/venv-wrapper-$V/bin/python
    zig build python -Dpython="$PY" \
        -Dgit-version="$(git describe --abbrev=0 --tag --always | cut -f2 -dv)"
    SO_DIR=$(sh tools/build-dir.sh)/python
    mkdir -p build/python-tests
    (cd build/python-tests && PYTHONPATH="$SO_DIR" "$PY" -m pytest -q ../../xdyn_wrapper_python/unit_tests)
done
'''

[tasks."python:wheel"]
description = "Package the module as a wheel and check it in a clean venv"
depends = ["python:build"]
# setup.py's build_ext is a no-op subclass: it packages a *prebuilt* .so found at the path
# distutils would have written one to. That path is not stable — it was lib.linux-x86_64-3.10 and
# is lib.linux-x86_64-cpython-310 on current setuptools — so ask setuptools instead of hardcoding.
#
# Stripping happens on the way into the wheel, never in the build tree: `mise run gdb` needs the
# debug info that makes the built .so 100x larger than the shipped one.
run = '''
set -e
SO_DIR=$(sh tools/build-dir.sh)/python
PY=$PWD/build/venv-wrapper/bin/python
cd xdyn_wrapper_python
DEST=$("$PY" -c "
from setuptools import Extension
from setuptools.dist import Distribution
from setuptools.command.build_ext import build_ext
cmd = build_ext(Distribution({'name': 'xdyn', 'ext_modules': [Extension('xdyn', sources=[])]}))
cmd.initialize_options(); cmd.finalize_options()
print(cmd.get_ext_fullpath('xdyn'))
")
mkdir -p "$(dirname "$DEST")"
# By EXT_SUFFIX, not a glob: SO_DIR legitimately holds one .so per ABI it has been built for.
SO=$SO_DIR/xdyn$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
cp "$SO" "$DEST"
# Not `zig objcopy --strip-debug`: it exists and answers "unimplemented" on this .so (zig 0.16).
# Warn rather than fail if neither stripper is around -- a fat wheel still works, and this must
# not be what blocks packaging.
for s in llvm-strip strip; do
    if command -v "$s" > /dev/null 2>&1; then "$s" --strip-debug "$DEST" && break; fi
    [ "$s" = strip ] && echo "warning: no llvm-strip/strip on PATH -- shipping unstripped"
done
GIT_VERSION=$(git describe --abbrev=0 --tag --always | cut -f2 -dv) "$PY" setup.py --quiet bdist_wheel
ls -la dist/*.whl
cd ..
# The wheel is the deliverable, so check the deliverable: a venv with numpy and a test runner and
# nothing else -- no pybind11, no source tree on sys.path -- must import it and pass all 285.
# --no-deps because the wheel declares none; any it grows should fail here loudly rather than be
# resolved from PyPI behind the check's back.
UV_PROJECT_ENVIRONMENT=build/venv-wheelcheck uv sync --only-group wheelcheck --quiet
uv pip install --python build/venv-wheelcheck/bin/python --quiet --reinstall --no-deps \
    xdyn_wrapper_python/dist/*.whl
mkdir -p build/python-tests
cd build/python-tests
../venv-wheelcheck/bin/python -m pytest -q ../../xdyn_wrapper_python/unit_tests
'''

[tasks."python:doc"]
description = "Build the wrapper's Sphinx API documentation -> build/python-doc/html/"
depends = ["python:build"]
# autosummary has to import the extension module to introspect it. That, and only that, is why
# this used to need a container with a wheel installed in it: PYTHONPATH to the build output does
# the same job, so the doc build no longer needs docker or a wheel at all.
#
# sphinx-quickstart runs every time because conf.py is not committed, which is how this worked
# before. Committing a conf.py instead would be the obvious next simplification.
run = '''
set -e
UV_PROJECT_ENVIRONMENT=build/venv-doc uv sync --only-group doc --quiet
SO_DIR=$(sh tools/build-dir.sh)/python
PY=$PWD/build/venv-doc/bin/python
DOC=$PWD/xdyn_wrapper_python/doc
OUT=$PWD/build/python-doc
GIT_VERSION=$(git describe --abbrev=0 --tag --always | cut -f2 -dv)
rm -rf "$OUT"
mkdir -p "$OUT"
cd "$OUT"
"$PY" -m sphinx.cmd.quickstart --quiet --project xdyn --author Sirehna \
    -v "$GIT_VERSION" -r "$GIT_VERSION" -l en --sep \
    --ext-autodoc --ext-doctest --ext-intersphinx --ext-todo \
    --extensions=sphinx.ext.autosummary \
    --extensions=sphinx_autopackagesummary \
    --extensions=myst_parser src
printf '\nautosummary_generate = True\nautoclass_content = "class"\n' >> src/source/conf.py
cp "$DOC"/index.rst "$DOC"/api.rst "$DOC"/xdyn.rst src/source/
mkdir -p src/source/_templates/autosummary
cp "$DOC"/autosummary/* src/source/_templates/autosummary/
PYTHONPATH="$SO_DIR" "$PY" -m sphinx -b html src/source html
echo "OK -> $OUT/html/index.html"
'''

[tasks."doc:cpp"]
description = "Build the C++ API reference with Doxygen -> build/doxygen/html/"
# docs/Doxyfile is a plain Doxyfile now, not a @VAR@ template substituted by CMake. Every
# path in it is relative, and doxygen resolves those against the *working directory* rather
# than against the Doxyfile's own location -- which is why this runs from the repository
# root and does not cd anywhere.
run = '''
set -e
mkdir -p build/doxygen
doxygen docs/Doxyfile
echo "OK -> $PWD/build/doxygen/html/index.html"
'''

[tasks."python:lint"]
description = "Check the wrapper's Python with ruff"
# `ruff check` only: ruff's formatter is not byte-compatible with the black the retired image
# pinned, so enforcing it is a one-time reformat that belongs in its own commit.
run = '''
UV_PROJECT_ENVIRONMENT=build/venv-lint uv sync --only-group lint --quiet
build/venv-lint/bin/ruff check
'''

[tasks."python:format"]
description = "Reformat the wrapper's Python with ruff (not enforced -- see python:lint)"
run = '''
UV_PROJECT_ENVIRONMENT=build/venv-lint uv sync --only-group lint --quiet
build/venv-lint/bin/ruff format
'''

[tasks.clean]
description = "Remove build/ — the install trees, the venvs and the generated docs"
# .zig-cache is deliberately NOT removed. It is the compilation cache, it reaches tens of GB,
# and rebuilding it costs what a full build costs; `clean` is for the outputs, not the cache.
# Delete it by hand when that is actually what you mean. Same reasoning as the closures,
# which live outside build/ for exactly this reason -- see .gitignore.
run = "rm -rf build"

[tasks.lint]
description = "Check for tabs in source files"
run = """
if grep --recursive --include='*.cpp' --include='*.c' --include='*.hpp' --include='*.h' \
        --exclude-dir=ssc --exclude-dir=yaml-cpp --exclude-dir=websocketpp \
        --exclude-dir=eigen3-hdf5 --exclude-dir=thirdparty -P "\t" xdyn/ ; then
    echo "Tabs found in the lines shown above."
    exit 1
else
    echo "Repo passed no-tabs check."
fi
"""
